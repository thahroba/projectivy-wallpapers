name: Fill wallpaper library from Pixabay
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the JSON list
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/build_pixabay_feed.py
      - name: Save updated list and API cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to save."
          else
            git add wallpapers.json pixabay-cache.json aerial-entries.json
            git commit -m "Build wallpaper feeds from Pixabay"
            git push
          fi
